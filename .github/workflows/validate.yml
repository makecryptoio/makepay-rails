name: validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate metadata
        run: node scripts/validate.mjs

      - name: Ruby syntax
        run: ruby -e 'Dir["{app,lib}/**/*.rb"].each { |file| system("ruby", "-c", file, exception: true) }'

      - name: Build gem
        run: gem build makepay-rails.gemspec
